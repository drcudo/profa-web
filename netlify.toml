[build]
  command = "npm run build"
  publish = "dist"

# Netlify Server obrađuje samo obrasce; sve ostalo poslužuje frontend.
[server]
  path = "/api/*"

# Obrasci se šalju na Netlify Server (netlify/server/index.mjs) na /api/*.
# Zato ovdje nema pravila "/* -> /index.html" koje bi prekrilo /api/*; svaka
# stranica React aplikacije navedena je posebno.

[[redirects]]
  from = "/matura-a-razina"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/matura-b-razina"
  to = "/index.html"
  status = 200

